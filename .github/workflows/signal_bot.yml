name: Run XAUUSD AI Signal Bot

on:
  # Berjalan otomatis setiap 10 menit
  - cron: '*/10 * * * *'
  workflow_dispatch: # Mengaktifkan tombol 'Run workflow' manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train/Update AI Model
        run: python train_ai.py

      - name: Execute Bot Signal Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_signal.py
